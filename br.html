</head>

<body>

<h1>Liblouis Braille Translator</h1>

<p>Paste English text:</p>

<textarea id="input" placeholder="Paste text here..."></textarea>

<br>

<button id="translateButton">Convert to Braille</button>

<div id="status">Loading Liblouis...</div>

<h2>Braille output</h2>

<textarea id="output" readonly></textarea>

<script src="https://cdn.jsdelivr.net/npm/liblouis-build@3.2.0/build-no-tables-utf16.js"></script>

<script src="https://cdn.jsdelivr.net/npm/liblouis@0.4.0/easy-api.js"></script>

<script>
    const capiUrl =
        "https://cdn.jsdelivr.net/npm/liblouis-build@3.2.0/build-no-tables-utf16.js";

    const easyApiUrl =
        "https://cdn.jsdelivr.net/npm/liblouis@0.4.0/easy-api.js";

    /*
     * Create the asynchronous Liblouis API.
     *
     * EasyApiAsync runs Liblouis in a Web Worker.
     */
    const liblouis = new window.liblouis.EasyApiAsync({
        capi: capiUrl,
        easyapi: easyApiUrl
    });

    /*
     * Tell Liblouis where it can download tables.
     */
    liblouis.enableOnDemandTableLoading(
        "https://cdn.jsdelivr.net/npm/liblouis-build@3.2.0/tables/"
    );

    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const button = document.getElementById("translateButton");
    const status = document.getElementById("status");

    liblouis.version(function(version) {
        status.textContent = "Liblouis " + version + " is ready.";
    });

    button.addEventListener("click", function() {
        const text = input.value;

        if (!text) {
            output.value = "";
            return;
        }

        status.textContent = "Translating...";

        liblouis.translateString(
            "tables/unicode.dis,tables/en-ueb-g2.ctb",
            text,
            function(result) {
                if (result === null) {
                    output.value = "";
                    status.textContent = "Translation failed.";
                    return;
                }

                output.value = result;
                status.textContent = "Translation complete.";
            }
        );
    });
</script>

</body>
</html>
